name: test-cpp

permissions: {}

on:
  push:
    branches:
      - main
      - renovate/**
    paths:
      - cpp/**
      - testdata/**
      - .github/**
  pull_request:
    paths:
      - cpp/**
      - testdata/**
      - .github/**

env:
  # Git ref (tag, branch, or SHA) of the cucumber dependencies to build against.
  # renovate: datasource=git-refs depName=cucumber/messages packageName=https://github.com/cucumber/messages currentValue=main
  MESSAGES_REF: e85a9eaf3fa3787c25bc62b6ea67672e709ee4fa
  # renovate: datasource=git-refs depName=cucumber/query packageName=https://github.com/cucumber/query currentValue=main
  QUERY_REF: 527f7cd114daa82bf4c60fd9c3433885ca86b212

jobs:
  test-cpp-system-packages-linux:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-24.04, cxx: g++, version: 12 }
          - { os: ubuntu-24.04, cxx: g++, version: 13 }
          - { os: ubuntu-24.04, cxx: clang++, version: 16 }
          - { os: ubuntu-24.04, cxx: clang++, version: 17 }
          - { os: ubuntu-26.04, cxx: g++, version: 14 }
          - { os: ubuntu-26.04, cxx: g++, version: 15 }
          - { os: ubuntu-26.04, cxx: clang++, version: 21 }
          - { os: ubuntu-26.04, cxx: clang++, version: 22 }
    env:
      CXX: ${{ matrix.config.cxx }}-${{ matrix.config.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ github.job }}-${{ matrix.config.os }}-${{ matrix.config.cxx }}-${{ matrix.config.version }}-${{ github.ref }}
          append-timestamp: false
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nlohmann-json3-dev libgtest-dev libgmock-dev

      # Ubuntu 24.04 ships fmt 9; newer runners provide fmt 10+ via apt.
      - name: Install libfmt (apt)
        if: matrix.config.os != 'ubuntu-24.04'
        run: sudo apt-get install -y libfmt-dev


      - name: Checkout libfmt
        if: matrix.config.os == 'ubuntu-24.04'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: fmtlib/fmt
          ref: 10.2.1
          path: fmt-src
          persist-credentials: false

      - name: Install libfmt (from source)
        if: matrix.config.os == 'ubuntu-24.04'
        run: |
          cmake -S fmt-src -B fmt-src/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DFMT_TEST=OFF -DFMT_DOC=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build fmt-src/build
          sudo cmake --install fmt-src/build

      - name: Install cucumber/messages
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/messages
          ref: ${{ env.MESSAGES_REF }}

      - name: Install cucumber/query
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/query
          ref: ${{ env.QUERY_REF }}

      - name: Build and unit test
        working-directory: cpp
        run: cmake --workflow --preset test-system

  test-cpp-system-packages-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ github.job }}-${{ github.ref }}
          append-timestamp: false
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: brew install nlohmann-json googletest fmt

      - name: Install cucumber/messages
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/messages
          ref: ${{ env.MESSAGES_REF }}

      - name: Install cucumber/query
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/query
          ref: ${{ env.QUERY_REF }}

      - name: Build and unit test
        working-directory: cpp
        run: cmake --workflow --preset test-system

  test-cpp-system-packages-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install build tools
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install dependencies
        shell: pwsh
        run: |
          vcpkg install nlohmann-json gtest fmt --triplet x64-windows
          # Expose the vcpkg toolchain so find_package() locates the packages.
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Install cucumber/messages
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/messages
          ref: ${{ env.MESSAGES_REF }}

      - name: Install cucumber/query
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/query
          ref: ${{ env.QUERY_REF }}

      - name: configure
        working-directory: cpp
        run: cmake --preset test-system

      - name: build
        working-directory: cpp
        run: cmake --build --preset test-system

      - name: Diagnose discovery
        working-directory: cpp/build/test-system
        shell: pwsh
        run: |
          cmake --version
          Write-Host "=== direct --gtest_list_tests ==="
          & .\test\cucumber_pretty_formatter.test.exe --gtest_list_tests
          Write-Host "exit code: $LASTEXITCODE"
          Write-Host "=== generated ctest files ==="
          Get-ChildItem -Recurse -Include *_tests.cmake,*_include.cmake,CTestTestfile.cmake |
            ForEach-Object { Write-Host "--- $($_.FullName) ---"; Get-Content $_.FullName }
          Write-Host "=== ctest verbose ==="
          ctest -V

      - name: test
        working-directory: cpp
        run: ctest --preset test-system


      - name: Build and unit test
        working-directory: cpp
        run: cmake --workflow --preset test-system

  test-cpp-coverage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nlohmann-json3-dev libgtest-dev libgmock-dev libfmt-dev
          python -m pip install gcovr==8.6
          gcovr --version

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ github.job }}-${{ github.ref }}
          append-timestamp: false
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cucumber/messages
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/messages
          ref: ${{ env.MESSAGES_REF }}

      - name: Install cucumber/query
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/query
          ref: ${{ env.QUERY_REF }}

      - name: Coverage
        working-directory: cpp
        run: cmake --workflow --preset coverage

      - name: Show coverage summary
        working-directory: cpp
        run: cat build/coverage/coverage-summary.md

  test-cpp-lint:
    runs-on: ubuntu-26.04
    env:
      CXX: clang++
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy nlohmann-json3-dev libgtest-dev libgmock-dev libfmt-dev

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ github.job }}-${{ github.ref }}
          append-timestamp: false
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cucumber/messages
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/messages
          ref: ${{ env.MESSAGES_REF }}

      - name: Install cucumber/query
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/query
          ref: ${{ env.QUERY_REF }}

      - name: Lint
        working-directory: cpp
        run: cmake --workflow --preset tidy
